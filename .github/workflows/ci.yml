name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          compact update
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Compile VeilBid auction contract
        run: |
          compact compile contracts/auction.compact managed
          cp -r managed/* public/managed/ || true
          echo "Compiled auction contract successfully"
          ls managed/

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
