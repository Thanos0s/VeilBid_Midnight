name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Install Compact compiler
        run: |
          RELEASE_URL="https://github.com/midnight-ntwrk/compact/releases/latest"
          COMPACT_VERSION=$(curl -sI "$RELEASE_URL" | grep -i location | sed 's/.*tag\/v//' | tr -d '[:space:]')
          echo "Installing compact compiler v${COMPACT_VERSION}"
          curl -fsSL "https://github.com/midnight-ntwrk/compact/releases/download/v${COMPACT_VERSION}/compact-v${COMPACT_VERSION}-x86_64-unknown-linux-musl.tar.gz" | tar xz
          sudo mv compact /usr/local/bin/compact
          compact --version

      - name: Compile VeilBid auction contract
        run: |
          compact compile contracts/auction.compact managed
          cp -r managed/* public/managed/ || true
          echo "Compiled auction contract"
          ls managed/

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build
